name: Android CI/CD

on:
  pull_request:
    branches:
      - "mobile-*"
      - "main"
  push:
    branches:
      - "mobile-*"
      - "main"

jobs:
  quality-gates:
    name: Quality Gates & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: "stable"
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --fatal-infos

      - name: Run unit & widget tests
        run: |
          if [ -d "test" ]; then
            flutter test --machine --coverage
          else
            echo "No test directory found, skipping unit tests"
          fi

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results-${{ github.run_number }}
          path: coverage/
          retention-days: 30

  build-android-nonprod:
    needs: quality-gates
    if: >
      needs.quality-gates.result == 'success' &&
      (
        (github.event_name == 'push' &&
         (github.ref == 'refs/heads/mobile-qa' ||
          github.ref == 'refs/heads/mobile-staging')
        )
        ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         (
           github.event.pull_request.head.ref == 'mobile-qa' ||
           github.event.pull_request.head.ref == 'mobile-staging'
         )
        )
      )
    runs-on: ubuntu-latest
    environment: non-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: "stable"
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Bundler
        run: gem install bundler -v 2.6.9 --no-document

      - name: Cache android/vendor/bundle
        uses: actions/cache@v4
        with:
          path: android/vendor/bundle
          key: ${{ runner.os }}-ruby-3.3-bundler-2.6.9-android-${{ hashFiles('android/Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-ruby-3.3-bundler-2.6.9-android-

      - name: Install Android Fastlane dependencies
        working-directory: android
        run: |
          bundle config set --local deployment 'false'
          bundle config set --local without 'development test'
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs=4 --retry=3

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-test-results-${{ github.run_number }}
          path: coverage/

      - name: Determine flavor from branch
        id: determine_flavor
        run: |
          if [ -n "${GITHUB_HEAD_REF}" ]; then
            BRANCH_NAME=${GITHUB_HEAD_REF}
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
          fi
          echo "Branch detected: $BRANCH_NAME"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            FLAV=dev
          elif [[ "$BRANCH_NAME" =~ ^mobile-(dev|qa|staging|prod)$ ]]; then
            FLAV=${BRANCH_NAME#mobile-}
          else
            echo "Branch name doesn't match main or mobile-<flavor>; defaulting to dev"
            FLAV=dev
          fi
          echo "FLAVOR=$FLAV" >> $GITHUB_ENV
          echo "flavor=$FLAV" >> $GITHUB_OUTPUT

      - name: Set up Android keystore (non-prod)
        run: |
          echo "== Android Keystore Setup (NON-PROD) =="
          echo "${{ secrets.ANDROID_KEYSTORE_NONPROD_BASE64 }}" | base64 --decode > android/petra-nonprod-key.jks
          EXPECTED_SHA="${{ secrets.ANDROID_KEYSTORE_NONPROD_SHA256 }}"
          ACTUAL_SHA=$(sha256sum android/petra-nonprod-key.jks | awk '{print $1}')
          echo "NON-PROD Keystore SHA256: $ACTUAL_SHA"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "ERROR: Keystore SHA256 mismatch!"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual: $ACTUAL_SHA"
            exit 1
          fi

          echo "Keystore verification passed ✓"
          echo "KEYSTORE_FILE=$PWD/android/petra-nonprod-key.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_NONPROD_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEYSTORE_NONPROD_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEYSTORE_NONPROD_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-cache-${{ runner.os }}-

      - name: Start interactive debug session (tmate) for QA
        if: steps.determine_flavor.outputs.flavor == 'qa'
        uses: mxschmitt/action-tmate@v3
        id: tmate1
        with:
          detached: false
          limit-access-to-actor: true

      - name: Create local.properties
        working-directory: android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Start interactive debug session (tmate) for QA
        if: steps.determine_flavor.outputs.flavor == 'qa'
        uses: mxschmitt/action-tmate@v3
        id: tmate2
        with:
          detached: false
          limit-access-to-actor: true

      - name: Create key.properties
        working-directory: android
        run: |
          echo "storeFile=$KEYSTORE_FILE" > key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties

      - name: Build Android
        working-directory: android
        run: |
          echo "Building Android flavor: $FLAVOR"
          bundle exec fastlane build flavor:$FLAVOR
        env:
          BUILD_NAME: 1.0.0
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Upload Android to Play Store
        if: steps.determine_flavor.outputs.flavor == 'qa' || steps.determine_flavor.outputs.flavor == 'staging'
        working-directory: android
        run: |
          echo "Uploading Android flavor: $FLAVOR to Play Store Internal track"
          bundle exec fastlane upload flavor:$FLAVOR
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_QA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_QA }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_STAGING: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_STAGING }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ steps.determine_flavor.outputs.flavor }}-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/**/*.aab
            build/app/outputs/mapping/**/*.txt
          retention-days: 30

  build-android-prod:
    needs: quality-gates
    if: >
      needs.quality-gates.result == 'success' &&
      (
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/mobile-prod'
        )
        ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.ref == 'mobile-prod'
        )
      )
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: "stable"
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Bundler
        run: gem install bundler -v 2.6.9 --no-document

      - name: Cache android/vendor/bundle
        uses: actions/cache@v4
        with:
          path: android/vendor/bundle
          key: ${{ runner.os }}-ruby-3.3-bundler-2.6.9-android-${{ hashFiles('android/Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-ruby-3.3-bundler-2.6.9-android-

      - name: Install Android Fastlane dependencies
        working-directory: android
        run: |
          bundle config set --local deployment 'false'
          bundle config set --local without 'development test'
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs=4 --retry=3

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-test-results-${{ github.run_number }}
          path: coverage/

      - name: Set flavor to prod
        run: echo "FLAVOR=prod" >> $GITHUB_ENV

      - name: Set up Android keystore (prod)
        run: |
          echo "== Android Keystore Setup (PROD) =="
          echo "${{ secrets.ANDROID_KEYSTORE_PROD_BASE64 }}" | base64 --decode > android/petra-release-key.jks
          EXPECTED_SHA="${{ secrets.ANDROID_KEYSTORE_PROD_SHA256 }}"
          ACTUAL_SHA=$(sha256sum android/petra-release-key.jks | awk '{print $1}')
          echo "PROD Keystore SHA256: $ACTUAL_SHA"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "ERROR: Keystore SHA256 mismatch!"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual: $ACTUAL_SHA"
            exit 1
          fi

          echo "Keystore verification passed ✓"
          echo "KEYSTORE_FILE=$PWD/android/petra-release-key.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PROD_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEYSTORE_PROD_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PROD_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-cache-${{ runner.os }}-

      - name: Create local.properties
        working-directory: android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Create key.properties
        working-directory: android
        run: |
          echo "storeFile=$KEYSTORE_FILE" > key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties

      - name: Build Android (prod)
        working-directory: android
        run: |
          echo "Building Android flavor: prod"
          bundle exec fastlane build flavor:prod
        env:
          BUILD_NAME: 1.0.0
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Upload Android to Play Store (production)
        working-directory: android
        run: |
          echo "Uploading Android prod to Play Store production track"
          bundle exec fastlane upload flavor:prod
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PROD: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PROD }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-prod-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/**/*.aab
            build/app/outputs/mapping/**/*.txt
          retention-days: 90
