name: Flutter CI/CD

on:
  pull_request:
    # run CI for pull requests targeting branch branches that start with `mobile-`
    branches:
      - "mobile-*"
      - "main"
  push:
    # build when pushing to flavor branches like mobile-dev, mobile-qa, mobile-staging, mobile-prod
    branches:
      - "mobile-*"
      - "main"

jobs:
  # Phase 1 — Prepare runner & tooling (bootstrap environment)
  prepare-and-test:
    name: Phase 1 - Setup & Quality Gates
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: "stable"
          cache: true
          architecture: "arm64"
        id: flutter

      # ===== Ruby, Bundler & Fastlane Setup =====
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false # We'll cache manually for ios/android separately

      - name: Install Bundler
        run: gem install bundler -v 2.6.9 --no-document

      - name: "Debug: PATH & Ruby env after installing Bundler"
        run: |
          echo "== PATH =="
          echo "$PATH"
          echo "== which executables =="
          which ruby || true
          which gem || true
          which bundle || true
          echo "== gem env =="
          gem env || true
          echo "== env vars affecting Ruby/Bundler =="
          env | grep -i "GEM\|RUBY\|BUNDLE" || true
          echo "== List Homebrew ruby dirs (if present) =="
          ls -la /opt/homebrew/lib/ruby || true
          ls -la /opt/homebrew/opt/ruby* || true

      - name: "Sanitize Ruby env (remove Homebrew ruby paths)"
        run: |
          echo "== Sanitizing Ruby environment: removing Homebrew Ruby entries =="
          # Remove Homebrew Ruby-specific entries from PATH while preserving order
          NEW_PATH=$(echo "$PATH" | tr ':' '\n' | grep -vE '/opt/homebrew/opt/ruby(@[0-9.]+)?/bin|/opt/homebrew/lib/ruby' | paste -sd: -)
          echo "PATH=$NEW_PATH" >> $GITHUB_ENV
          # Clear GEM and RUBY env vars that can point to Homebrew locations
          echo "GEM_HOME=" >> $GITHUB_ENV
          echo "GEM_PATH=" >> $GITHUB_ENV
          echo "RUBYLIB=" >> $GITHUB_ENV
          echo "RUBYOPT=" >> $GITHUB_ENV
          echo "Sanitized PATH: $NEW_PATH"
          echo "Ruby load path after sanitize (current process):"
          ruby -e 'puts $LOAD_PATH' || true
          echo "gem env after sanitize (current process):"
          gem env || true

      - name: Cache ios/vendor/bundle
        uses: actions/cache@v4
        with:
          path: ios/vendor/bundle
          key: ${{ runner.os }}-ruby-3.3-bundler-2.6.9-ios-v2-${{ hashFiles('ios/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.3-bundler-2.6.9-ios-

      - name: Install iOS dependencies
        working-directory: ios
        run: |
          # Force-clear vendor/bundle to avoid reusing cached native gems built under a different Ruby/toolchain
          rm -rf vendor/bundle || true
          bundle config set --local deployment 'false'
          bundle config set --local without 'development test'
          bundle config set --local path 'vendor/bundle'
          # Run bundle via hosted Ruby which strips Homebrew entries from $LOAD_PATH before exec
          HOSTED_RUBY_BIN=$(which ruby)
          export GEM_HOME="$PWD/vendor/bundle"
          export GEM_PATH="$GEM_HOME"
          unset RUBYOPT RUBYLIB
          "$HOSTED_RUBY_BIN" -e 'begin; $LOAD_PATH.reject! { |p| p =~ %r{/opt/homebrew} }; rescue => e; STDERR.puts "LOAD_PATH cleanup error: #{e}"; end; exec(*ARGV)' -- bundle install --jobs=4 --retry=3
      - name: "Debug: show Ruby/Bundler and ios/vendor/bundle"
        run: |
          echo "== Ruby & Bundler info =="
          which ruby || true
          ruby --version || true
          which gem || true
          gem env || true
          bundle --version || true
          echo "== ios/vendor/bundle contents =="
          ls -la ios/vendor/bundle || echo "ios/vendor/bundle does not exist or is empty"
          echo "== native extension files (if any) =="
          find ios/vendor/bundle -type f \( -name '*.so' -o -name '*.bundle' \) -print || true

      - name: Cache android/vendor/bundle
        uses: actions/cache@v4
        with:
          path: android/vendor/bundle
          key: ${{ runner.os }}-ruby-3.3-bundler-2.6.9-android-v2-${{ hashFiles('android/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.3-bundler-2.6.9-android-

      - name: Install Android dependencies
        working-directory: android
        run: |
          # Force-clear vendor/bundle to avoid reusing cached native gems built under a different Ruby/toolchain
          rm -rf vendor/bundle || true
          bundle config set --local deployment 'false'
          bundle config set --local without 'development test'
          bundle config set --local path 'vendor/bundle'
          HOSTED_RUBY_BIN=$(which ruby)
          export GEM_HOME="$PWD/vendor/bundle"
          export GEM_PATH="$GEM_HOME"
          unset RUBYOPT RUBYLIB
          "$HOSTED_RUBY_BIN" -e 'begin; $LOAD_PATH.reject! { |p| p =~ %r{/opt/homebrew} }; rescue => e; STDERR.puts "LOAD_PATH cleanup error: #{e}"; end; exec(*ARGV)' -- bundle install --jobs=4 --retry=3

      # ===== Java/JDK Setup (for Android builds) =====
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ===== Caching =====
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ===== Environment Verification =====
      - name: Verify tooling installation
        run: |
          echo "=== Flutter ==="
          flutter --version
          flutter doctor -v
          echo ""
          echo "=== Ruby & Bundler ==="
          ruby --version
          bundle --version
          echo ""
          echo "=== Java ==="
          java -version
          echo ""
          echo "Phase 1 - Environment setup complete ✓"

      # ===== Phase 2 Activities (Quality Gates) =====
      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --fatal-infos

      - name: Run unit & widget tests
        run: |
          if [ -d "test" ]; then
            flutter test --machine --coverage
          else
            echo "No test directory found, skipping unit tests"
          fi

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-results-${{ github.run_number }}
          path: |
            coverage/
          retention-days: 30

      # ===== Phase 3 — Install Platform Dependencies & Validate iOS Pod Integration =====
      - name: Phase 3 - Install iOS Pods & validate
        working-directory: ios
        run: |
          echo "== Phase 3: pod install (repo update) =="
          echo "Ruby & Bundler info:"
          which ruby || true
          which bundle || true
          # Use the hosted toolcache Ruby binary explicitly to avoid Homebrew site_ruby being loaded
          HOSTED_RUBY_BIN=$(which ruby)
          echo "Using hosted ruby: $HOSTED_RUBY_BIN"
          # Ensure gems are loaded from the repository vendor/bundle
          export GEM_HOME="$PWD/vendor/bundle"
          export GEM_PATH="$GEM_HOME"
          # Clear RUBYOPT/RUBYLIB to avoid pulling in Homebrew site_ruby paths
          unset RUBYOPT
          unset RUBYLIB
          # Diagnostic: show runtime and gem paths right before pod install
          echo "== Diagnostic: ruby & gem info before pod install =="
          echo "which ruby: $(which ruby)"
          ruby -v || true
          echo "HOSTED_RUBY_BIN=$HOSTED_RUBY_BIN"
          ruby -e 'require "rubygems"; puts "Gem.path:"; puts Gem.path' || true
          echo "GEM_HOME=$GEM_HOME GEM_PATH=$GEM_PATH RUBYLIB=$RUBYLIB RUBYOPT=$RUBYOPT"
          "$HOSTED_RUBY_BIN" -S bundle env | sed -n '1,120p' || true
          # Show pod/bin shebang (if present)
          if command -v pod >/dev/null 2>&1; then
            echo "pod binstub shebang:"; head -n 1 "$(command -v pod)" || true
          else
            echo "pod not on PATH; showing possible vendor binstub:"; head -n 1 ios/vendor/bundle/ruby/*/bin/pod 2>/dev/null || true
          fi
          # Remove any pod binstub that might be shebanged to Homebrew Ruby
          rm -f ios/vendor/bundle/ruby/*/bin/pod || true
          # Run pod install under the hosted Ruby and the local bundle
          "$HOSTED_RUBY_BIN" -S bundle exec pod install --repo-update || exit $?

          echo "== Pod install exit: $? "

          # Basic sanity checks - fail the job if required Pod support files for flavors are missing
          MISSING=0
          REQUIRED_FILES=(
            "Pods/Target Support Files/Pods-Runner/Pods-Runner.release-prod.xcconfig"
            "Pods/Target Support Files/Pods-Runner/Pods-Runner.release-dev.xcconfig"
            "Pods/Target Support Files/Pods-Runner/Pods-Runner.release-qa.xcconfig"
            "Pods/Target Support Files/Pods-Runner/Pods-Runner.release-staging.xcconfig"
          )
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing expected pod support file: $f"
              MISSING=1
            fi
          done

          # Show generated xcfilelists for debugging
          echo "Listing xcfilelist files (if present):"
          ls -1 Pods/Target\ Support\ Files/Pods-Runner/*.xcfilelist || true

          if [ "$MISSING" -eq 1 ]; then
            echo "One or more required Pod support files are missing; failing the job."
            exit 2
          fi

          echo "Phase 3 completed: pods installed and basic validation passed ✓"

  # Phase 5 — Non-prod builds (QA, Staging) - auto-deploy to Internal/TestFlight
  build-nonprod:
    needs: prepare-and-test
    # Only run for qa and staging branches
    if: >
      needs.prepare-and-test.result == 'success' &&
      (
        (github.event_name == 'push' &&
         (github.ref == 'refs/heads/mobile-qa' ||
          github.ref == 'refs/heads/mobile-staging')
        )
        ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         (
           github.event.pull_request.head.ref == 'mobile-qa' ||
           github.event.pull_request.head.ref == 'mobile-staging'
         )
        )
      )
    runs-on: macos-latest
    environment: non-prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: "stable"
          cache: true
          architecture: "arm64"
        id: flutter

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Bundler
        run: gem install bundler -v 2.6.9 --no-document

      - name: "Debug: PATH & Ruby env after installing Bundler"
        run: |
          echo "== PATH =="
          echo "$PATH"
          echo "== which executables =="
          which ruby || true
          which gem || true
          which bundle || true
          echo "== gem env =="
          gem env || true
          echo "== env vars affecting Ruby/Bundler =="
          env | grep -i "GEM\|RUBY\|BUNDLE" || true
          echo "== List Homebrew ruby dirs (if present) =="
          ls -la /opt/homebrew/lib/ruby || true
          ls -la /opt/homebrew/opt/ruby* || true

      - name: "Sanitize Ruby env (remove Homebrew ruby paths)"
        run: |
          echo "== Sanitizing Ruby environment: removing Homebrew Ruby entries =="
          NEW_PATH=$(echo "$PATH" | tr ':' '\n' | grep -vE '/opt/homebrew/opt/ruby(@[0-9.]+)?/bin|/opt/homebrew/lib/ruby' | paste -sd: -)
          echo "PATH=$NEW_PATH" >> $GITHUB_ENV
          echo "GEM_HOME=" >> $GITHUB_ENV
          echo "GEM_PATH=" >> $GITHUB_ENV
          echo "RUBYLIB=" >> $GITHUB_ENV
          echo "RUBYOPT=" >> $GITHUB_ENV
          echo "Sanitized PATH: $NEW_PATH"
          ruby -e 'puts $LOAD_PATH' || true
          gem env || true

      - name: Cache ios/vendor/bundle
        uses: actions/cache@v4
        with:
          path: ios/vendor/bundle
          key: ${{ runner.os }}-ruby-3.3-bundler-2.6.9-ios-${{ hashFiles('ios/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.3-bundler-2.6.9-ios-

      - name: Install iOS dependencies
        working-directory: ios
        run: |
          # Force-clear vendor/bundle to ensure gems (including native extensions) are rebuilt under the hosted Ruby
          rm -rf vendor/bundle || true
          bundle config set --local deployment 'true'
          bundle config set --local without 'development test'
          bundle config set --local path 'vendor/bundle'
          HOSTED_RUBY_BIN=$(which ruby)
          export GEM_HOME="$PWD/vendor/bundle"
          export GEM_PATH="$GEM_HOME"
          unset RUBYOPT RUBYLIB
          "$HOSTED_RUBY_BIN" -e 'begin; $LOAD_PATH.reject! { |p| p =~ %r{/opt/homebrew} }; rescue => e; STDERR.puts "LOAD_PATH cleanup error: #{e}"; end; exec(*ARGV)' -- bundle install --jobs=4 --retry=3

      - name: "Debug: show Ruby/Bundler and ios/vendor/bundle"
        run: |
          echo "== Ruby & Bundler info =="
          which ruby || true
          ruby --version || true
          which gem || true
          gem env || true
          bundle --version || true
          echo "== ios/vendor/bundle contents =="
          ls -la ios/vendor/bundle || echo "ios/vendor/bundle does not exist or is empty"
          echo "== native extension files (if any) =="
          find ios/vendor/bundle -type f \( -name '*.so' -o -name '*.bundle' \) -print || true

      - name: Cache android/vendor/bundle
        uses: actions/cache@v4
        with:
          path: android/vendor/bundle
          key: ${{ runner.os }}-ruby-3.3-bundler-2.6.9-android-${{ hashFiles('android/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.3-bundler-2.6.9-android-

      - name: Install Android dependencies
        working-directory: android
        run: |
          # Force-clear vendor/bundle to ensure gems (including native extensions) are rebuilt under the hosted Ruby
          rm -rf vendor/bundle || true
          bundle config set --local deployment 'true'
          bundle config set --local without 'development test'
          bundle config set --local path 'vendor/bundle'
          HOSTED_RUBY_BIN=$(which ruby)
          export GEM_HOME="$PWD/vendor/bundle"
          export GEM_PATH="$GEM_HOME"
          unset RUBYOPT RUBYLIB
          "$HOSTED_RUBY_BIN" -e 'begin; $LOAD_PATH.reject! { |p| p =~ %r{/opt/homebrew} }; rescue => e; STDERR.puts "LOAD_PATH cleanup error: #{e}"; end; exec(*ARGV)' -- bundle install --jobs=4 --retry=3

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-test-results-${{ github.run_number }}
          path: coverage/

      - name: Determine flavor from branch
        id: determine_flavor
        run: |
          # For pull_request events from forks, GITHUB_HEAD_REF is set
          if [ -n "${GITHUB_HEAD_REF}" ]; then
            BRANCH_NAME=${GITHUB_HEAD_REF}
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
          fi
          echo "Branch detected: $BRANCH_NAME"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            FLAV=dev
          elif [[ "$BRANCH_NAME" =~ ^mobile-(dev|qa|staging|prod)$ ]]; then
            FLAV=${BRANCH_NAME#mobile-}
          else
            echo "Branch name doesn't match main or mobile-<flavor>; defaulting to dev"
            FLAV=dev
          fi
          echo "FLAVOR=$FLAV" >> $GITHUB_ENV
          echo "flavor=$FLAV" >> $GITHUB_OUTPUT

      # ===== Phase 4 — iOS Code Signing Setup =====
      - name: Phase 4a - Set up iOS signing (Fastlane Match)
        run: |
          echo "== Phase 4a: iOS Code Signing Setup =="
          # Create ephemeral keychain for code signing
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Set match type based on flavor (non-prod = adhoc, prod = appstore)
          if [[ "$FLAVOR" == "prod" ]]; then
            echo "MATCH_TYPE=appstore" >> $GITHUB_ENV
          else
            echo "MATCH_TYPE=adhoc" >> $GITHUB_ENV
          fi

          # Decode and configure SSH key for Match git access
          mkdir -p ~/.ssh
          echo "${{ secrets.MATCH_GIT_PRIVATE_KEY }}" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Configure git to use the SSH key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/match_deploy_key -o IdentitiesOnly=yes"
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/match_deploy_key -o IdentitiesOnly=yes" >> $GITHUB_ENV

          # Export match env vars for subsequent steps
          echo "MATCH_GIT_URL=${{ secrets.MATCH_GIT_URL }}" >> $GITHUB_ENV
          echo "MATCH_GIT_BRANCH=${{ secrets.MATCH_GIT_BRANCH }}" >> $GITHUB_ENV

          echo "iOS signing environment prepared (MATCH_TYPE=$MATCH_TYPE) ✓"
        env:
          FLAVOR: ${{ env.FLAVOR }}

      # ===== Phase 4b — Android Keystore Setup (Non-prod) =====
      - name: Phase 4b - Set up Android keystore (non-prod)
        run: |
          echo "== Phase 4b: Android Keystore Setup (NON-PROD) =="
          # Use non-prod keystore for qa/staging
          echo "${{ secrets.ANDROID_KEYSTORE_NONPROD_BASE64 }}" | base64 --decode > android/petra-nonprod-key.jks
          EXPECTED_SHA="${{ secrets.ANDROID_KEYSTORE_NONPROD_SHA256 }}"

          # Verify keystore SHA256 fingerprint
          ACTUAL_SHA=$(shasum -a 256 android/petra-nonprod-key.jks | awk '{print $1}')
          echo "NON-PROD Keystore SHA256: $ACTUAL_SHA"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "ERROR: Keystore SHA256 mismatch!"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual: $ACTUAL_SHA"
            exit 1
          fi

          echo "Keystore verification passed ✓"

          # Set signing environment variables for Gradle
          echo "KEYSTORE_FILE=petra-nonprod-key.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_NONPROD_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEYSTORE_NONPROD_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEYSTORE_NONPROD_KEY_PASSWORD }}" >> $GITHUB_ENV

          echo "Android keystore environment configured ✓"

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Build Android (flavor from branch)
        working-directory: android
        run: |
          echo "Building Android flavor: $FLAVOR"
          bundle exec fastlane build flavor:$FLAVOR
        env:
          BUILD_NAME: 1.0.0
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Upload Android to Play Store
        if: steps.determine_flavor.outputs.flavor == 'qa' || steps.determine_flavor.outputs.flavor == 'staging'
        working-directory: android
        run: |
          echo "Uploading Android flavor: $FLAVOR to Play Store Internal track"
          bundle exec fastlane upload flavor:$FLAVOR
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_QA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_QA }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_STAGING: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_STAGING }}

      - name: Upload Android artifacts (AAB + mapping)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ steps.determine_flavor.outputs.flavor }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/**/*.aab
            android/app/build/outputs/mapping/**/*.txt
          retention-days: 30

      - name: Install iOS Pods (build job)
        working-directory: ios
        run: |
          HOSTED_RUBY_BIN=$(which ruby)
          echo "Using hosted ruby: $HOSTED_RUBY_BIN"
          export GEM_HOME="$PWD/vendor/bundle"
          export GEM_PATH="$GEM_HOME"
          unset RUBYOPT
          unset RUBYLIB
          echo "== Diagnostic: ruby & gem info before pod install (build job) =="
          echo "which ruby: $(which ruby)"
          ruby -v || true
          echo "HOSTED_RUBY_BIN=$HOSTED_RUBY_BIN"
          ruby -e 'require "rubygems"; puts "Gem.path:"; puts Gem.path' || true
          echo "GEM_HOME=$GEM_HOME GEM_PATH=$GEM_PATH RUBYLIB=$RUBYLIB RUBYOPT=$RUBYOPT"
          "$HOSTED_RUBY_BIN" -S bundle env | sed -n '1,120p' || true
          if command -v pod >/dev/null 2>&1; then
            echo "pod binstub shebang:"; head -n 1 "$(command -v pod)" || true
          else
            echo "pod not on PATH; showing possible vendor binstub:"; head -n 1 ios/vendor/bundle/ruby/*/bin/pod 2>/dev/null || true
          fi
          # Remove any pod binstub that might be shebanged to Homebrew Ruby
          rm -f ios/vendor/bundle/ruby/*/bin/pod || true
          "$HOSTED_RUBY_BIN" -S bundle exec pod install --repo-update

      - name: Run Fastlane Match (iOS)
        working-directory: ios
        run: |
          echo "Fetching certificates via Match (type: $MATCH_TYPE)"
          bundle exec fastlane fetch_certificates
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
          MATCH_TYPE: ${{ env.MATCH_TYPE }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Phase 4a - Signing sanity checks (debug)
        if: always()
        run: |
          echo "== Signing debug: env = =="
          echo "MATCH_TYPE=${MATCH_TYPE}"
          echo "MATCH_GIT_URL=${MATCH_GIT_URL}"
          echo "MATCH_GIT_BRANCH=${MATCH_GIT_BRANCH}"
          echo "GIT_SSH_COMMAND=${GIT_SSH_COMMAND}"

          echo "== Ensure build.keychain is in search list =="
          security list-keychains -d user -s build.keychain login.keychain || true

          echo "== Unlock keychain =="
          security unlock-keychain -p "" build.keychain || true

          echo "== (Optional) set key partition list (may require password) =="
          security set-key-partition-list -S apple-tool:,apple: -s -k "" ~/Library/Keychains/build.keychain-db || echo "set-key-partition-list failed (ok if keys already accessible)"

          echo "== List keychains =="
          security list-keychains -d user

          echo "== Show signing identities (build.keychain) =="
          security find-identity -v -p codesigning ~/Library/Keychains/build.keychain-db || security find-identity -v -p codesigning

          echo "== List provisioning profiles =="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

          echo "== Verify SSH/Git access to match repo =="
          GIT_SSH_COMMAND="ssh -i ~/.ssh/match_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            git ls-remote "${MATCH_GIT_URL}" refs/heads/"${MATCH_GIT_BRANCH}" || true

          echo "== Xcode version =="
          xcodebuild -version || true

        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
          MATCH_TYPE: ${{ env.MATCH_TYPE }}

      - name: Build iOS (flavor from branch)
        working-directory: ios
        run: |
          echo "Building iOS flavor: $FLAVOR"
          bundle exec fastlane build flavor:$FLAVOR
        env:
          BUILD_NAME: 1.0.0
          BUILD_NUMBER: ${{ github.run_number }}
          MATCH_TYPE: ${{ env.MATCH_TYPE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Upload iOS to TestFlight
        if: steps.determine_flavor.outputs.flavor == 'qa' || steps.determine_flavor.outputs.flavor == 'staging'
        working-directory: ios
        run: |
          echo "Uploading iOS flavor: $FLAVOR to TestFlight (Internal)"
          bundle exec fastlane upload flavor:$FLAVOR
        env:
          MATCH_TYPE: ${{ env.MATCH_TYPE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Upload iOS artifacts (IPA + dSYM)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ steps.determine_flavor.outputs.flavor }}-${{ github.run_number }}
          path: |
            ios/build/*.ipa
            ios/build/*.dSYM.zip
          retention-days: 30

  # Phase 5 — Production builds - gated with manual approval
  build-prod:
    needs: prepare-and-test
    # Only run for prod branch
    if: >
      needs.prepare-and-test.result == 'success' &&
      (
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/mobile-prod'
        )
        ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.ref == 'mobile-prod'
        )
      )
    runs-on: macos-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: "stable"
          cache: true
          architecture: "arm64"
        id: flutter

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Bundler
        run: gem install bundler -v 2.6.9 --no-document

      - name: "Debug: PATH & Ruby env after installing Bundler"
        run: |
          echo "== PATH =="
          echo "$PATH"
          echo "== which executables =="
          which ruby || true
          which gem || true
          which bundle || true
          echo "== gem env =="
          gem env || true
          echo "== env vars affecting Ruby/Bundler =="
          env | grep -i "GEM\|RUBY\|BUNDLE" || true
          echo "== List Homebrew ruby dirs (if present) =="
          ls -la /opt/homebrew/lib/ruby || true
          ls -la /opt/homebrew/opt/ruby* || true

      - name: "Sanitize Ruby env (remove Homebrew ruby paths)"
        run: |
          echo "== Sanitizing Ruby environment: removing Homebrew Ruby entries =="
          NEW_PATH=$(echo "$PATH" | tr ':' '\n' | grep -vE '/opt/homebrew/opt/ruby(@[0-9.]+)?/bin|/opt/homebrew/lib/ruby' | paste -sd: -)
          echo "PATH=$NEW_PATH" >> $GITHUB_ENV
          echo "GEM_HOME=" >> $GITHUB_ENV
          echo "GEM_PATH=" >> $GITHUB_ENV
          echo "RUBYLIB=" >> $GITHUB_ENV
          echo "RUBYOPT=" >> $GITHUB_ENV
          echo "Sanitized PATH: $NEW_PATH"
          ruby -e 'puts $LOAD_PATH' || true
          gem env || true

      - name: Cache ios/vendor/bundle
        uses: actions/cache@v4
        with:
          path: ios/vendor/bundle
          key: ${{ runner.os }}-ruby-3.3-bundler-2.6.9-ios-${{ hashFiles('ios/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.3-bundler-2.6.9-ios-

      - name: Install iOS dependencies
        working-directory: ios
        run: |
          # Force-clear vendor/bundle to ensure gems (including native extensions) are rebuilt under the hosted Ruby
          rm -rf vendor/bundle || true
          bundle config set --local deployment 'true'
          bundle config set --local without 'development test'
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs=4 --retry=3

      - name: Cache android/vendor/bundle
        uses: actions/cache@v4
        with:
          path: android/vendor/bundle
          key: ${{ runner.os }}-ruby-3.3-bundler-2.6.9-android-${{ hashFiles('android/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.3-bundler-2.6.9-android-

      - name: Install Android dependencies
        working-directory: android
        run: |
          # Force-clear vendor/bundle to ensure gems (including native extensions) are rebuilt under the hosted Ruby
          rm -rf vendor/bundle || true
          bundle config set --local deployment 'true'
          bundle config set --local without 'development test'
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs=4 --retry=3

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-test-results-${{ github.run_number }}
          path: coverage/

      - name: Determine flavor from branch
        id: determine_flavor
        run: |
          # For prod, always set flavor to prod
          echo "FLAVOR=prod" >> $GITHUB_ENV
          echo "flavor=prod" >> $GITHUB_OUTPUT
          echo "Branch: mobile-prod, Flavor: prod"

      # ===== Phase 4 — iOS Code Signing Setup (Prod) =====
      - name: Phase 4a - Set up iOS signing (Fastlane Match - appstore)
        run: |
          echo "== Phase 4a: iOS Code Signing Setup (PROD) =="
          # Create ephemeral keychain for code signing
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Set match type for prod (appstore)
          echo "MATCH_TYPE=appstore" >> $GITHUB_ENV

          # Decode and configure SSH key for Match git access
          mkdir -p ~/.ssh
          echo "${{ secrets.MATCH_GIT_PRIVATE_KEY }}" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Configure git to use the SSH key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/match_deploy_key -o IdentitiesOnly=yes"
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/match_deploy_key -o IdentitiesOnly=yes" >> $GITHUB_ENV

          # Export match env vars for subsequent steps
          echo "MATCH_GIT_URL=${{ secrets.MATCH_GIT_URL }}" >> $GITHUB_ENV
          echo "MATCH_GIT_BRANCH=${{ secrets.MATCH_GIT_BRANCH }}" >> $GITHUB_ENV

          echo "iOS signing environment prepared (MATCH_TYPE=appstore) ✓"

      # ===== Phase 4b — Android Keystore Setup (Prod) =====
      - name: Phase 4b - Set up Android keystore (prod)
        run: |
          echo "== Phase 4b: Android Keystore Setup (PROD) =="
          # Use prod keystore
          echo "${{ secrets.ANDROID_KEYSTORE_PROD_BASE64 }}" | base64 --decode > android/petra-release-key.jks
          EXPECTED_SHA="${{ secrets.ANDROID_KEYSTORE_PROD_SHA256 }}"

          # Verify keystore SHA256 fingerprint
          ACTUAL_SHA=$(shasum -a 256 android/petra-release-key.jks | awk '{print $1}')
          echo "PROD Keystore SHA256: $ACTUAL_SHA"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "ERROR: Keystore SHA256 mismatch!"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual: $ACTUAL_SHA"
            exit 1
          fi

          echo "Keystore verification passed ✓"

          # Set signing environment variables for Gradle
          echo "KEYSTORE_FILE=petra-release-key.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PROD_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEYSTORE_PROD_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PROD_KEY_PASSWORD }}" >> $GITHUB_ENV

          echo "Android keystore environment configured ✓"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Build Android (prod)
        working-directory: android
        run: |
          echo "Building Android flavor: prod"
          bundle exec fastlane build flavor:prod
        env:
          BUILD_NAME: 1.0.0
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Upload Android to Play Store (production track)
        working-directory: android
        run: |
          echo "Uploading Android prod to Play Store production track"
          bundle exec fastlane upload flavor:prod
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PROD: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PROD }}

      - name: Upload Android artifacts (AAB + mapping)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-prod-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/**/*.aab
            android/app/build/outputs/mapping/**/*.txt
          retention-days: 90

      - name: Install iOS Pods (build job)
        working-directory: ios
        run: |
          HOSTED_RUBY_BIN=$(which ruby)
          echo "Using hosted ruby: $HOSTED_RUBY_BIN"
          export GEM_HOME="$PWD/vendor/bundle"
          export GEM_PATH="$GEM_HOME"
          unset RUBYOPT
          unset RUBYLIB
          echo "== Diagnostic: ruby & gem info before pod install (prod build job) =="
          echo "which ruby: $(which ruby)"
          ruby -v || true
          echo "HOSTED_RUBY_BIN=$HOSTED_RUBY_BIN"
          ruby -e 'require "rubygems"; puts "Gem.path:"; puts Gem.path' || true
          echo "GEM_HOME=$GEM_HOME GEM_PATH=$GEM_PATH RUBYLIB=$RUBYLIB RUBYOPT=$RUBYOPT"
          "$HOSTED_RUBY_BIN" -S bundle env | sed -n '1,120p' || true
          if command -v pod >/dev/null 2>&1; then
            echo "pod binstub shebang:"; head -n 1 "$(command -v pod)" || true
          else
            echo "pod not on PATH; showing possible vendor binstub:"; head -n 1 ios/vendor/bundle/ruby/*/bin/pod 2>/dev/null || true
          fi
          # Remove any pod binstub that might be shebanged to Homebrew Ruby
          rm -f ios/vendor/bundle/ruby/*/bin/pod || true
          "$HOSTED_RUBY_BIN" -S bundle exec pod install --repo-update

      - name: Run Fastlane Match (iOS - appstore)
        working-directory: ios
        run: |
          echo "Fetching certificates via Match (type: appstore)"
          bundle exec fastlane fetch_certificates
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
          MATCH_TYPE: appstore
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Phase 4a - Signing sanity checks (debug)
        if: always()
        run: |
          echo "== Signing debug: env = =="
          echo "MATCH_TYPE=${MATCH_TYPE}"
          echo "MATCH_GIT_URL=${MATCH_GIT_URL}"
          echo "MATCH_GIT_BRANCH=${MATCH_GIT_BRANCH}"
          echo "GIT_SSH_COMMAND=${GIT_SSH_COMMAND}"

          echo "== Ensure build.keychain is in search list =="
          security list-keychains -d user -s build.keychain login.keychain || true

          echo "== Unlock keychain =="
          security unlock-keychain -p "" build.keychain || true

          echo "== (Optional) set key partition list (may require password) =="
          security set-key-partition-list -S apple-tool:,apple: -s -k "" ~/Library/Keychains/build.keychain-db || echo "set-key-partition-list failed (ok if keys already accessible)"

          echo "== List keychains =="
          security list-keychains -d user

          echo "== Show signing identities (build.keychain) =="
          security find-identity -v -p codesigning ~/Library/Keychains/build.keychain-db || security find-identity -v -p codesigning

          echo "== List provisioning profiles =="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

          echo "== Verify SSH/Git access to match repo =="
          GIT_SSH_COMMAND="ssh -i ~/.ssh/match_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            git ls-remote "${MATCH_GIT_URL}" refs/heads/"${MATCH_GIT_BRANCH}" || true

          echo "== Xcode version =="
          xcodebuild -version || true

        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
          MATCH_TYPE: appstore

      - name: Build iOS (prod)
        working-directory: ios
        run: |
          echo "Building iOS flavor: prod"
          bundle exec fastlane build flavor:prod
        env:
          BUILD_NAME: 1.0.0
          BUILD_NUMBER: ${{ github.run_number }}
          MATCH_TYPE: appstore
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Upload iOS to TestFlight/App Store
        working-directory: ios
        run: |
          echo "Uploading iOS prod to TestFlight/App Store"
          bundle exec fastlane upload flavor:prod
        env:
          MATCH_TYPE: appstore
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Upload iOS artifacts (IPA + dSYM)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-prod-${{ github.run_number }}
          path: |
            ios/build/*.ipa
            ios/build/*.dSYM.zip
          retention-days: 90
